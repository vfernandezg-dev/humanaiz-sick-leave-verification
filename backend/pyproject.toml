[project]
name = "humanaiz"
version = "0.1.0"
description = "API y motor de escaneo de descansos médicos de HumanAIz"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "google-genai>=3.3.0",
    "limits>=5.8.0",
    "openai>=3.51.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
humanaiz = "humanaiz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanaiz"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
  "S101",   # assert en tests
  "RUF001", # texto en español con caracteres "ambiguos"
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# En tests: secretos de mentira, E/S bloqueante sobre archivos temporales y SQL
# construido con nombres de tabla del propio modelo.
"tests/**" = ["S105", "S106", "S311", "S608", "E501", "ASYNC230", "ASYNC240", "RUF059"]
# Las pruebas e2e manejan el stack local con `docker compose`.
"tests/e2e/**" = ["S105", "S106", "S311", "S603", "S607", "S608", "E501"]
"migrations/**" = ["E501"]
# El CLI es un proceso de un solo uso: la E/S bloqueante no afecta a nadie.
"src/humanaiz/cli.py" = ["ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "live: llama a un proveedor real; requiere una clave en el entorno y nunca corre en CI",
  "e2e: requiere el stack de docker compose levantado",
]
addopts = "-m 'not live and not e2e' -q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
